name: Isolated R2 media verification

on:
  push:
    branches: [audit/pnyx-remediation-20261025]
    paths:
      - .github/workflows/r2-media-verification.yml
      - docs/r2-media-verification-request.json

permissions:
  contents: read

concurrency:
  group: pnyx-isolated-r2-media
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'kellyxy110/Pnyx' && github.ref == 'refs/heads/audit/pnyx-remediation-20261025'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read explicit isolated test request
        id: request
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const request = JSON.parse(readFileSync('docs/r2-media-verification-request.json', 'utf8'));
          if (typeof request.enabled !== 'boolean') throw new Error('Expected an explicit boolean test request.');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${request.enabled}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, request.enabled
            ? 'Isolated R2 acceptance requested. Environment protections and test credentials are required.\n'
            : 'R2 acceptance is disabled pending private test credential configuration. No provider test executed.\n');
          JS

  media:
    needs: request
    if: needs.request.outputs.enabled == 'true' && github.repository == 'kellyxy110/Pnyx' && github.ref == 'refs/heads/audit/pnyx-remediation-20261025'
    environment: pnyx-r2-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pnyx_fixture
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: pnyx_verify_media
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pnyx_fixture -d pnyx_verify_media"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pnyx_fixture:disposable_ci_only@127.0.0.1:5432/pnyx_verify_media?connection_limit=10
      APP_URL: http://127.0.0.1:3000
      PNYX_DISPOSABLE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify disposable PostgreSQL and dedicated R2 media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://395a51a8c72b810731d9acaa5266922e.r2.cloudflarestorage.com
          R2_BUCKET_NAME: pnyx-e2e-media
          R2_PUBLIC_BASE_URL: https://pub-fe45f8c612524833a03a0bcb536aeccd.r2.dev
          E2E_STORAGE_ENABLED: 'true'
          E2E_STORAGE_ENDPOINT: https://395a51a8c72b810731d9acaa5266922e.r2.cloudflarestorage.com
          E2E_STORAGE_BUCKET: pnyx-e2e-media
          E2E_STORAGE_PUBLIC_BASE_URL: https://pub-fe45f8c612524833a03a0bcb536aeccd.r2.dev
        run: |
          node -e 'if (!process.env.R2_ACCESS_KEY_ID || !process.env.R2_SECRET_ACCESS_KEY) { console.error("Dedicated environment credentials are missing; no media verification started."); process.exit(1); }'
          npm run verify:media
